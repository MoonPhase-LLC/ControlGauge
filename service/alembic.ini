# Developer-only Alembic CLI configuration (authoring new migrations).
# The running service never reads this file: it migrates its own database
# programmatically at startup (src/controlgauge_service/db/migrate.py).
# The URL below is a throwaway scratch database, gitignored.
[alembic]
script_location = %(here)s/src/controlgauge_service/migrations
sqlalchemy.url = sqlite:///%(here)s/.alembic-dev.db
