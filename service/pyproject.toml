[project]
name = "controlgauge-service"
version = "0.1.0"
description = "ControlGauge local analysis service (Python/FastAPI, loopback-only, session-token authenticated)."
authors = [
    { name = "Mahin Moon", email = "124702885+Xirro9@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<0.116",
    # Sprint 5 (PD-024): the model-runtime provider's only HTTP client --
    # loopback-only calls to the llama-server subprocess. Promoted from a
    # dev dependency (where FastAPI's TestClient already required it); the
    # provider always constructs it with `trust_env=False` so proxy
    # environment variables can never route loopback traffic externally.
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.6,<3.0",
    # Sprint 4 (PD-016): PDF text extraction inside the contained parser
    # worker. Pure Python (no native code, no required dependencies), so it
    # adds no memory-corruption surface of its own. DOCX/TXT/CSV use stdlib.
    "pypdf>=6,<7",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn>=0.34,<0.35",
    # Sprint 5 (S5-02): deterministic validation of the *dynamic* JSON
    # schemas the pipeline passes to structured generation. Hand-rolling a
    # JSON Schema validator is a correctness risk; jsonschema is
    # established, pure Python, and validates against the standard.
    "jsonschema>=4.23,<5",
]

[project.scripts]
controlgauge-service = "controlgauge_service:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13,<1.14",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<0.9",
    "types-jsonschema>=4.23,<5",
]
package = [
    "pyinstaller>=6.11,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: `assert` is how pytest tests assert. S105/S106: fixed literal test
# tokens are intentional, not real secrets. S104: test data deliberately
# includes "0.0.0.0" as a case that must be *rejected*.
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "packaging"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
